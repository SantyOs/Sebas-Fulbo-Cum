services:
  web:
    image: nginx@sha256:4a73073bd557c65b759505da037898b61f1be6cbcc3c2c3aeac22d2a470c1752
    restart: unless-stopped
    ports:
      - "100.116.191.99:8086:80"
    volumes:
      - /srv/sebas-fulbo:/srv/sebas-fulbo:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1/version.json]
      interval: 30s
      timeout: 5s
      retries: 3
  runner:
    build:
      context: .
      dockerfile: runner.Dockerfile
    restart: unless-stopped
    init: true
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    volumes:
      - runner-state:/runner
      - /srv/sebas-fulbo:/srv/sebas-fulbo

volumes:
  runner-state:
