# Cloudflare terminates HTTPS; Traefik forwards HTTP over the Docker proxy network.
server {
    listen 80;
    server_name fulbo.sosdev.com.co 100.116.191.99;
    root /srv/sebas-fulbo/current;
    index index.html;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location / {
        try_files $uri $uri/ =404;
        expires -1;
    }

    # Models have stable names; revalidate them on new releases.
    location /assets/players/ {
        try_files $uri =404;
        expires -1;
    }

    # Vite adds content hashes to these filenames.
    location /assets/ {
        try_files $uri =404;
        expires 1y;
    }
}
